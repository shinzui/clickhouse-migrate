name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    # Darwin clients plus an owned Linux arm64 server; no managed-cloud claim.
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CLICKHOUSE_MIGRATE_DOCKER_CONTEXT: colima-clickhouse-migrate-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: shinzui
      - name: Prepare the isolated exact Linux server candidate
        run: |
          test "$(uname -m)" = arm64
          brew install colima docker
          colima start clickhouse-migrate-ci --activate=false --cpu 4 --memory 8 --disk 30 --mount none --ssh-config=false
          docker --context "$CLICKHOUSE_MIGRATE_DOCKER_CONTEXT" pull docker.io/altinity/clickhouse-server@sha256:3bafa18ced8daf9b81de70927b40c13b06545363abe3ad7f20ae77848f500c5a
          docker --context "$CLICKHOUSE_MIGRATE_DOCKER_CONTEXT" pull docker.io/altinity/clickhouse-server@sha256:7e72405bf85df6d163205ee2e56251ebc35daf6dc71142f58bdee7a461690ffb
      - run: nix develop --builders '' --accept-flake-config -c ghc --numeric-version
      - run: nix develop --builders '' --accept-flake-config -c cabal update
      - run: nix develop --builders '' --accept-flake-config -c just build
      - run: nix develop --builders '' --accept-flake-config -c just check-packages
      - run: nix develop --builders '' --accept-flake-config -c just test-unit
      - run: nix develop --builders '' --accept-flake-config -c just test-embedding
      - run: nix develop --builders '' --accept-flake-config -c just check-public-invariants
      - name: Validate user documentation and reviews
        # Released OKF tool; canonical project: mori://shinzui/okf.
        run: nix develop --builders '' --accept-flake-config -c nix shell --inputs-from . github:shinzui/okf/bdf8893ccf0dfbd77fd68fe3c58348b5e49809c7 nixpkgs#dhall -c just check-docs check-reviews
      - run: nix develop --builders '' --accept-flake-config -c just sdist
      - run: nix fmt --accept-flake-config -- --fail-on-change
      - run: nix flake check --builders '' --accept-flake-config
      - run: nix develop --builders '' --accept-flake-config -c just test-release-matrix
      - run: nix develop --builders '' --accept-flake-config -c just check-production-closure
      - run: nix develop --builders '' --accept-flake-config -c just haddock
      - run: nix develop --builders '' --accept-flake-config -c just qualify-distributions
      - name: Stop the owned qualification VM
        if: always()
        run: colima stop clickhouse-migrate-ci
